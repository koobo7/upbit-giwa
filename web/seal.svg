<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 100 100" aria-label="인감" role="img">
    <defs>
      <clipPath id="sealClip"><circle cx="50" cy="50" r="46"/></clipPath>
    </defs>
    <g clip-path="url(#sealClip)">
      <!-- 도장이 찍힌 듯한 미세한 번짐 -->
      <circle cx="50" cy="50" r="46" fill="#c0392b" opacity=".07"/>
    </g>
    <circle cx="50" cy="50" r="44" fill="none" stroke="#d33f36" stroke-width="5"/>
    <line x1="50" y1="12" x2="50" y2="88" stroke="#d33f36" stroke-width="2.5"/>
    <!-- 인(印) / 감(鑑)을 한글 전서 느낌으로 배치 -->
    <text x="29" y="43" text-anchor="middle" fill="#d33f36"
          font-size="26" font-weight="700"
          font-family="'Nanum Myeongjo','Apple SD Gothic Neo',serif">인</text>
    <text x="71" y="43" text-anchor="middle" fill="#d33f36"
          font-size="26" font-weight="700"
          font-family="'Nanum Myeongjo','Apple SD Gothic Neo',serif">감</text>
    <text x="50" y="78" text-anchor="middle" fill="#d33f36"
          font-size="17" font-weight="700" letter-spacing="1"
          font-family="'Nanum Myeongjo','Apple SD Gothic Neo',serif">委任</text>
  </svg>
